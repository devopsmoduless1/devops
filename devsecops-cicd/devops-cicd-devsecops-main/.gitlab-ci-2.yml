default:
 tags:
  - gitlab-k8-kkm
 image:
  name: registry.gitlab.com/vino6441212/devops:ci-baseimage

stages:
- SAST
- SAST-REPORT
- BUILD
- HADOLINT
- DOCKER IMAGE SCAN
- DOCKER IMAGE BUILD & PUSH
- DEPLOY TO KUBERNETES

