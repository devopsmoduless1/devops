.dev_vars:
  variables:
    TF_VAR_region: "eu-west-2"
    TF_VAR_cluster_name: "devops"
    TF_VAR_vpc_cidr: "10.0.0.0/16"
    TF_VAR_cluster_version: "1.30"
    TF_VAR_instance_type: "t2.medium"
    TF_ROOT: "eks"

plan infra dev:
 stage: plan
 variables:
     ENV: "dev"
 extends:
   - .dev_vars
   - .plan

apply infra dev:
 stage: apply
 variables:
     ENV: "dev"
 extends:
   - .dev_vars
   - .apply
 needs: [plan infra dev]
 when: manual

plan destroy infra dev:
 stage: plan-destroy
 variables:
     ENV: "dev"
 extends:
   - .dev_vars
   - .plan_destroy
 when: manual


destroy infra dev:
 stage: destroy
 variables:
     ENV: "dev"
 extends:
   - .dev_vars
   - .destroy
 needs: [plan destroy infra dev]
 when: manual
