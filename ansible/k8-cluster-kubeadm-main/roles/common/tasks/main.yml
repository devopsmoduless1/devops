- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap entry from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^\s*([^#\n]+\s+){2}swap\s'
    replace: '# \1'

- name: Load kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Enable kernel modules
  ansible.builtin.shell: |
    modprobe overlay
    modprobe br_netfilter

- name: Set sysctl params
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Apply sysctl params
  ansible.builtin.command: sysctl --system

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    update_cache: yes
# --------------------------
# Containerd installation
# --------------------------

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd config
  ansible.builtin.shell: |
    containerd config default|sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
#  args:
#    creates: /etc/containerd/config.toml

- name: Restart and enable containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: restarted
# --------------------------
# Kubernetes installation
# -------------------------
- name: Add Kubernetes apt key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
    dest: /tmp/kubernetes-apt-keyring.gpg

- name: Store Kubernetes apt keyring
  ansible.builtin.command:
    cmd: gpg --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-apt-keyring.gpg

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
    state: present
    filename: kubernetes

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
- name: Hold Kubernetes packages
  ansible.builtin.command:
    cmd: "sudo apt-mark unhold {{ item }}"
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - kubelet=1.32.3-1.1
      - kubeadm=1.32.3-1.1
      - kubectl=1.32.3-1.1
    state: present
    update_cache: yes

- name: Enable and start kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: yes
    state: started

- name: Hold Kubernetes packages
  ansible.builtin.command:
    cmd: "sudo apt-mark hold {{ item }}"
  loop:
    - kubelet
    - kubeadm
    - kubectl