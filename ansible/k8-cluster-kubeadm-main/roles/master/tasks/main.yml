- name: Initialize Kubernetes master
  ansible.builtin.command: kubeadm init --apiserver-advertise-address {{ hostvars['master']['ansible_host_internalip'] }} --pod-network-cidr=10.244.0.0/16 --upload-certs
  args:
    creates: /etc/kubernetes/admin.conf
  register: init_output

- name: Always get kubeadm join command
  ansible.builtin.shell: |
    kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Set persistent join command fact
  set_fact:
    kube_join_command: "{{ join_command.stdout }}"

- name: Create .kube directory
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  when: ansible_user == "ubuntu"

- name: Copy kube config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    owner: ubuntu
    group: ubuntu
    mode: '0644'
    remote_src: true
  when: ansible_user == "ubuntu"

# Flannel: https://github.com/flannel-io/flannel#deploying-flannel-manually
# Default Pod cidr set is 10.244.0.0/16. Make sure to match  kubeadm init --pod-network-cidr=10.244.0.0/16
- name: Install Flannel CNI
  ansible.builtin.command: >
    kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

