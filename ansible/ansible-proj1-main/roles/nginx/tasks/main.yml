- name: Install NGINX on Ubuntu
  apt:
    name: nginx
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install NGINX on RedHat
  yum:
    name: nginx
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure NGINX is running
  service:
    name: nginx
    state: started
    enabled: true

- name: Add index.html
  copy:
    dest: /usr/share/nginx/html/index.html
    content: "<h1>Hello from GitLab + Ansible on {{ ansible_distribution }}</h1>"
